x noise, sometimes careless with blots. Intermediate: one-ply with little noise. Advanced: two-ply expectiminimax over the opponent’s 21 rolls for the best 8 plays. Expert: two-ply on a wider candidate set, exact bear-off table and full cube logic. Strength ratings have not been measured. The optional self-play trainer (More → AI training) can refine the evaluator for every level; a new network is used only after it beats the current one.","help.notation":"Notation","help.notationText":"24/18 13/8: two checkers move. * marks a hit (13/7*); bar/22 enters from the bar; 6/off bears off; 8/4(2) moves two checkers.","diag.title":"Diagnostics","diag.intro":"The built-in test suite checks every rule from the specification, the dice, the GNU Backgammon IDs and 500 AI self-play games. The same suite runs under Node with npm run diagnostics.","diag.test":"Test","diag.result":"Result","diag.time":"Time","diag.pass":"Pass","diag.fail":"Fail","diag.pending":"Pending","diag.runningOne":"Running…","diag.summary":"{pass} of {total} tests passed in {s} s","diag.extra":"extra","diag.expected":"expected {v}","diag.actual":"actual {v}","an.title":"Post-game analysis","an.by":"Analysis by the built-in engine (one-ply). Equity is per unit of cube; match play uses normalised match equity.","an.game":"Game","an.running":"Analysing…","an.none":"No game to analyse yet.","an.player":"Player","an.decisions":"Decisions","an.errors":"Errors","an.blunders":"Blunders","an.loss":"Equity lost","an.rate":"Error rate (mEMG)","an.luck":"Luck","an.luckRating":"Luck rating","an.move":"Move","an.played":"Played","an.best":"Engine’s choice","an.rating.ok":"OK","an.rating.error":"Error","an.rating.blunder":"Blunder","an.kind.play":"Play","an.kind.double":"Double","an.kind.no-double":"No double","an.kind.take":"Take","an.kind.pass":"Pass","an.kind.beaver":"Beaver","luck.veryLucky":"Very lucky","luck.lucky":"Lucky","luck.neutral":"Neutral","luck.unlucky":"Unlucky","luck.veryUnlucky":"Very unlucky","fair.title
